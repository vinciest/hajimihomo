# profiles/group-anchors.yaml
# Source of truth for static proxy group anchor definitions.
# NOT a Clash config — compiled by anchor-builder.ts to a YAML text fragment.
#
# Structure (same shape as rule-provider-anchors.yaml):
#   name:     anchor name (e.g. GroupBase) — meta, not emitted as a field
#   extends:  (optional) parent anchor — emits <<: *<Name> merge key before object fields
#   object:   actual Clash config fields emitted verbatim
#
# Template vars in field values:
#   {{ProxyHealthUrl}} → emitted as *ProxyHealthUrl (YAML anchor reference)
#   {{FilterNotify}}  → emitted as *FilterNotify   (YAML anchor reference)
#
# § GroupBase
#   No extends — shared fields inherited by all auto-selection leaf groups.
#   GroupSmart (vernesong fork) does NOT extend GroupBase — its leaf groups must
#   emit include-all and exclude-filter explicitly.
#
# § GroupSelect
#   No extends — bare select anchor with icon.
#   Order here controls dummy-key assignment in compileGroupAnchors().

anchors:
  - name: GroupBase
    object:
      url: '{{ProxyHealthUrl}}'
      lazy: true
      include-all: true
      exclude-filter: '{{FilterNotify}}'

  - name: GroupSelect
    extends: GroupBase
    object:
      type: select
      icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png"

  - name: GroupUrlTest
    extends: GroupBase
    object:
      type: url-test
      interval: 300
      tolerance: 50
      icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Urltest.png"

  - name: GroupFallback
    extends: GroupBase
    object:
      type: fallback
      interval: 300
      tolerance: 100
      icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Available.png"

  - name: GroupLBHash
    extends: GroupBase
    object:
      type: load-balance
      strategy: consistent-hashing
      interval: 600
      tolerance: 100
      icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Roundrobin.png"

  - name: GroupLBRobin
    extends: GroupBase
    object:
      type: load-balance
      strategy: round-robin
      interval: 600
      tolerance: 100
      icon: "https://fastly.jsdelivr.net/gh/Orz-3/mini@master/Color/Roundrobin.png"
