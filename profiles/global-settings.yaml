# profiles/global-settings.yaml
# Single source of truth for constants shared across all profile sections.
# Processed first by the build pipeline — values are available to all anchor
# and section templates (group-anchors, rule-provider-anchors, proxy-providers,
# filter-anchors, region-anchors).
#
# § health_url
#   The URL used for proxy-provider and proxy-group health checks.
#   Previously hardcoded in proxy-provider-anchors.yaml.eta and referenced by
#   group-anchors.yaml via {{HealthUrl}}.
#
# § info_pattern
#   Regex alternation matching "informational" proxy node names (traffic/subscription
#   notices, announcements). Used to build &FilterInfo, &FilterExclude, and the
#   proxy-provider junk-node filter.
#
# § custom_exclude_pattern
#   Additional regex alternation merged into &FilterExclude (e.g. speed-tier
#   markers, restricted-node flags).

health_url: 'https://cp.cloudflare.com/generate_204'

info_pattern: '群|邀请|返利|循环|官网|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|客服|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|访问|支持|教程|关注|更新|作者|加入|(?i)USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic'

custom_exclude_pattern: 'X5|5x|X10|10x|DirectAccess|移动网络|禁止下载|禁止视频'
