# ── proxy provider anchor ─────────────────────────────────────────────────────
# Edit here to update all proxy-providers at once (interval, health-check, filter).
_pp: &ProxyProvider
  type: http
  interval: 86400
  proxy: DIRECT
  health-check:
    enable: true
    url: 'https://www.google.com/generate_204'
    interval: 300
  filter: '^(?!.*(群|订阅|到期|流量|机场|官网|邮箱|通知|Panel|Author|TOTAL|EXPIRE)).*$'
