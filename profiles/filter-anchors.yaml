# profiles/filter-anchors.yaml
# Source of truth for ALL filter anchors used in generated mihomo profiles.
# Compiled by anchor-builder.ts via yaml-b64 plugin — edit here, never duplicate elsewhere.
#
# Structure (same shape as group-anchors / rule-provider-anchors):
#   vars:      raw alternation strings substituted into anchor values via {{var}}
#   anchors:   explicit anchor definitions — name: + value: (string anchor)
#              region anchors carry label: (display name) and icon: (full URL)
#
# § How anchors are used in generated profiles:
#   &FilterNotify   — filter: on 通知公告 + exclude-filter: on every proxy leaf group
#   &FilterHK/TW/…  — filter: on region leaf and strategy groups
#
# § Region order here is the canonical order used throughout the generated profile
#   (group names, strategy group ordering, etc.).

vars:

  hk-pattern: '港|香港|🇭🇰|HK|HKG|Hong ?Kong'
  tw-pattern: '台|台湾|🇹🇼|TW|TWN|Taiwan|TPE|TSA|KHH'
  sg-pattern: '坡|狮城|🇸🇬|SG|SGP|Singapore|SIN|XSP|新加坡'
  jp-pattern: '日|日本|🇯🇵|JP|JPN|Japan|NRT|HND|KIX|CTS|FUK|东京|大阪|泉日|埼玉'
  jp-exclude: '尼日利亚'
  kr-pattern: '韩|韩国|🇰🇷|KR|KOR|Korea|南朝鲜|首尔'
  us-pattern: '美|美国|🇺🇸|US|USA|United ?States|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|旧金山|圣何塞|圣克拉拉|西雅图|芝加哥'
  us-exclude: '亚美尼亚'
  eu-pattern: '奥|比|保|克罗地亚|塞|捷|丹|爱沙|芬|法|德|希|匈|爱|意|拉|立|卢|马|荷|波|葡|罗|西|瑞典|英|🇩🇪|🇫🇷|🇬🇧|🇳🇱|🇸🇪|CDG|FRA|AMS|LHR|MUC'

anchors:
  - name: FilterNotify
    value: '^(?=.*({{info-pattern}})).*$'

  - name: FilterHK
    label: 香港
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png'
    value: '^(?=.*(?i)({{hk-pattern}}))(?!.*({{custom-exclude-pattern}})).*$'

  - name: FilterTW
    label: 台湾
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png'
    value: '^(?=.*(?i)({{tw-pattern}}))(?!.*({{custom-exclude-pattern}})).*$'

  - name: FilterSG
    label: 狮城
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png'
    value: '^(?=.*(?i)({{sg-pattern}}))(?!.*({{custom-exclude-pattern}})).*$'

  - name: FilterJP
    label: 日本
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png'
    value: '^(?=.*(?i)({{jp-pattern}}))(?!.*({{jp-exclude}}|{{custom-exclude-pattern}})).*$'

  - name: FilterKR
    label: 韩国
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Korea.png'
    value: '^(?=.*(?i)({{kr-pattern}}))(?!.*({{custom-exclude-pattern}})).*$'

  - name: FilterUS
    label: 美国
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png'
    value: '^(?=.*(?i)({{us-pattern}}))(?!.*({{us-exclude}}|{{custom-exclude-pattern}})).*$'

  - name: FilterEU
    label: 欧盟
    icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/European_Union.png'
    value: '^(?=.*(?i)({{eu-pattern}}))(?!.*({{custom-exclude-pattern}})).*$'
