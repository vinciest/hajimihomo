<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hajimihomo · 代理配置生成</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117; color: #c9d1d9;
      min-height: 100vh; padding: 2rem 1rem;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 2rem; }
    .section { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 0.4rem; }
    select, input, textarea {
      width: 100%; padding: 0.5rem 0.75rem;
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #c9d1d9; font-size: 0.9rem;
    }
    select:focus, input:focus, textarea:focus {
      outline: none; border-color: #388bfd;
    }
    textarea { resize: vertical; min-height: 80px; font-family: monospace; font-size: 0.8rem; }
    .categories-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.4rem; margin-top: 0.5rem;
    }
    .cat-item {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.3rem 0.5rem; background: #161b22;
      border: 1px solid #30363d; border-radius: 4px; cursor: pointer;
      font-size: 0.8rem;
    }
    .cat-item:hover { border-color: #388bfd; }
    .cat-item input[type="checkbox"] { accent-color: #388bfd; }
    .btn {
      padding: 0.6rem 1.5rem; background: #238636; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    }
    .btn:hover { background: #2ea043; }
    .btn-secondary {
      background: #21262d; border: 1px solid #30363d; margin-left: 0.5rem;
    }
    .btn-secondary:hover { background: #30363d; }
    .output-block {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 1rem; margin-top: 1rem; font-family: monospace; font-size: 0.78rem;
      white-space: pre-wrap; overflow-x: auto; max-height: 500px;
    }
    .tag {
      display: inline-block; padding: 0.1rem 0.4rem;
      border-radius: 3px; font-size: 0.7rem; font-weight: 600;
      background: #1f3a5f; color: #79c0ff; margin-left: 0.3rem;
    }
    .tag.ip { background: #3d2b00; color: #e3b341; }
    .tag.mixed { background: #3d1f00; color: #f0883e; }
    .tag.block { background: #3d0000; color: #ff7b72; }
    .tag.direct { background: #0d3c00; color: #56d364; }
    .tag.proxy { background: #1f3a5f; color: #79c0ff; }
    .notice {
      background: #161b22; border: 1px solid #30363d; border-left: 3px solid #8b949e;
      border-radius: 4px; padding: 0.75rem 1rem; font-size: 0.8rem; color: #8b949e;
      margin-bottom: 1.5rem;
    }
    /* ── Advanced mode toggle ── */
    .mode-toggle {
      display: flex; gap: 0; margin-bottom: 1.5rem;
      border: 1px solid #30363d; border-radius: 6px; overflow: hidden;
    }
    .mode-toggle button {
      flex: 1; padding: 0.5rem; background: #161b22; color: #8b949e;
      border: none; cursor: pointer; font-size: 0.85rem;
    }
    .mode-toggle button.active { background: #1f6feb; color: #fff; }
    .mode-toggle button:hover:not(.active) { background: #21262d; color: #c9d1d9; }
    /* ── Advanced layout ── */
    .advanced-layout {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;
    }
    @media (max-width: 640px) { .advanced-layout { grid-template-columns: 1fr; } }
    .adv-panel {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 0.75rem; min-height: 500px; display: flex; flex-direction: column;
    }
    .adv-tabs { display: flex; gap: 0; margin-bottom: 0.5rem; }
    .adv-tab {
      flex: 1; padding: 0.4rem; background: #161b22; color: #8b949e;
      border: 1px solid #30363d; cursor: pointer; font-size: 0.8rem;
    }
    .adv-tab:first-child { border-radius: 4px 0 0 4px; }
    .adv-tab:last-child  { border-radius: 0 4px 4px 0; }
    .adv-tab.active { background: #21262d; color: #c9d1d9; border-color: #58a6ff; }
    .adv-search {
      width: 100%; padding: 0.4rem 0.6rem; margin-bottom: 0.5rem;
      background: #161b22; border: 1px solid #30363d; border-radius: 4px;
      color: #c9d1d9; font-size: 0.8rem;
    }
    .adv-browser-content { flex: 1; overflow-y: auto; }
    .adv-group-row { margin-bottom: 2px; }
    .adv-group-header {
      display: flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.5rem;
      background: #161b22; border: 1px solid #30363d; border-radius: 4px; cursor: pointer;
      font-size: 0.8rem;
    }
    .adv-group-header:hover { border-color: #388bfd; }
    .adv-expand { color: #58a6ff; font-size: 0.75rem; min-width: 12px; }
    .adv-group-name { flex: 1; }
    .adv-member-count { color: #8b949e; font-size: 0.75rem; }
    .adv-members { padding: 2px 0 2px 1rem; display: flex; flex-direction: column; gap: 2px; }
    .adv-cat-row {
      display: flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.5rem;
      background: #0d1117; border: 1px solid #21262d; border-radius: 3px; font-size: 0.78rem;
    }
    .adv-cat-name { flex: 1; }
    .adv-grp-badge { color: #8b949e; font-size: 0.7rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .adv-tag, .adv-type-tag {
      display: inline-block; padding: 0.05rem 0.35rem; border-radius: 3px;
      font-size: 0.68rem; font-weight: 600;
    }
    .adv-tag.block, .adv-type-tag.block  { background: #3d0000; color: #ff7b72; }
    .adv-tag.direct, .adv-type-tag.direct { background: #0d3c00; color: #56d364; }
    .adv-tag.proxy, .adv-type-tag.proxy  { background: #1f3a5f; color: #79c0ff; }
    .adv-tag.domain, .adv-type-tag.domain { background: #1c2a3e; color: #79c0ff; }
    .adv-tag.ip, .adv-type-tag.ip        { background: #3d2b00; color: #e3b341; }
    .adv-tag.mixed, .adv-type-tag.mixed  { background: #3d1f00; color: #f0883e; }
    .adv-tag.unknown, .adv-type-tag.unknown { background: #21262d; color: #8b949e; }
    .adv-add-btn {
      padding: 0.1rem 0.4rem; background: #21262d; border: 1px solid #30363d;
      border-radius: 3px; color: #79c0ff; cursor: pointer; font-size: 0.75rem; margin-left: auto;
    }
    .adv-add-btn:hover { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    .adv-vscroll { border: 1px solid #21262d; border-radius: 4px; }
    /* ── Custom Groups (right panel) ── */
    .adv-cg-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;
    }
    .btn-sm {
      padding: 0.3rem 0.75rem; background: #21262d; border: 1px solid #30363d;
      border-radius: 4px; color: #c9d1d9; cursor: pointer; font-size: 0.8rem;
    }
    .btn-sm:hover { background: #30363d; }
    .adv-cg-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .adv-cg-card {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 0.5rem;
    }
    .adv-card-header {
      display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem;
    }
    .adv-drag-handle {
      color: #8b949e; cursor: grab; font-size: 1rem; padding: 0 0.2rem;
    }
    .adv-drag-handle:active { cursor: grabbing; }
    .adv-name-input {
      flex: 1; padding: 0.25rem 0.4rem; background: #0d1117; border: 1px solid #30363d;
      border-radius: 3px; color: #c9d1d9; font-size: 0.82rem;
    }
    .adv-name-input:focus { border-color: #388bfd; outline: none; }
    .adv-action-sel {
      padding: 0.25rem 0.3rem; background: #0d1117; border: 1px solid #30363d;
      border-radius: 3px; color: #c9d1d9; font-size: 0.78rem; width: auto;
    }
    .adv-del-card {
      background: none; border: none; color: #8b949e; cursor: pointer; padding: 0.1rem 0.3rem;
      font-size: 0.85rem;
    }
    .adv-del-card:hover { color: #ff7b72; }
    .adv-card-items { display: flex; flex-direction: column; gap: 2px; min-height: 30px; }
    .adv-card-item {
      display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.4rem;
      background: #0d1117; border: 1px solid #21262d; border-radius: 3px; font-size: 0.78rem;
      cursor: grab;
    }
    .adv-card-item:active { cursor: grabbing; }
    .adv-item-label { flex: 1; }
    .adv-del-item {
      background: none; border: none; color: #8b949e; cursor: pointer; font-size: 0.75rem; padding: 0;
    }
    .adv-del-item:hover { color: #ff7b72; }
    .adv-empty-hint { color: #8b949e; font-size: 0.78rem; padding: 0.25rem 0; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>hajimihomo</h1>
    <p class="subtitle">代理规则配置生成工具 · mihomo / sing-box</p>
    <div class="notice">
      个人使用，不保证稳定性。规则集来源于公开上游，按需自取。
    </div>
    <div id="app"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
